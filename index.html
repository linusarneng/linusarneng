<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>linusarneng - GitHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.6.1/github-markdown-light.min.css" />
  <style>
    body {
      background: #f6f8fa;
      margin: 0;
      padding: 32px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    .github-page {
      max-width: 1012px;
      margin: 0 auto;
    }

    .profile-box {
      background: #ffffff;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 16px;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .markdown-body {
      font-size: 14px;
    }

    /* Banner hover zoom */
    .banner-link {
      display: block;
      overflow: hidden;
      border-radius: 4px;
    }
    .banner-link img {
      max-width: 100%;
      display: block;
      transition: transform 0.4s ease, filter 0.4s ease;
    }
    .banner-link:hover img {
      transform: scale(1.03);
      filter: brightness(1.08);
    }

    /* Typing animation — centered via flex */
    .typing-wrap {
      display: flex;
      justify-content: center;
      margin: 16px 0 8px;
    }
    .typing-text {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1f2328;
      white-space: nowrap;
      position: relative;
      animation: typing 1.8s steps(18, end) 0.3s both;
    }
    .typing-text::after {
      content: '';
      position: absolute;
      right: -4px;
      top: 0;
      height: 100%;
      width: 2px;
      background: #1f2328;
      animation: blink 0.75s step-end infinite;
    }
    @keyframes typing {
      from { clip-path: inset(0 100% 0 0); }
      to   { clip-path: inset(0 0% 0 0); }
    }
    @keyframes blink {
      50% { opacity: 0; }
    }

    /* Skills list */
    .skills-section h3 {
      margin-bottom: 12px;
    }
    .skill-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 0.9rem;
      color: #1f2328;
    }
    .skill-row:last-child {
      border-bottom: none;
    }
    .skill-icon {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .skill-area {
      font-weight: 600;
      min-width: 80px;
      color: #656d76;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .skill-techs {
      color: #1f2328;
    }

    /* Email badge hover glow */
    .email-link {
      display: inline-block;
      transition: transform 0.2s, filter 0.2s;
    }
    .email-link:hover {
      transform: translateY(-2px);
      filter: drop-shadow(0 4px 8px #0969da55);
    }

    /* Working on tag */
    .flutter-tag {
      display: inline-block;
      background: #ddf4ff;
      border: 1px solid #54aeff66;
      color: #0969da;
      border-radius: 20px;
      padding: 2px 12px;
      font-size: 0.82rem;
      font-weight: 500;
      transition: background 0.2s, transform 0.2s;
      cursor: default;
    }
    .flutter-tag:hover {
      background: #b6e3ff;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="github-page">
    <div class="profile-box">
      <article class="markdown-body">

        <a class="banner-link" href="https://github.com/linusarneng">
          <img src="https://64.media.tumblr.com/54805606e41234da265775f4ee8631ef/41d4a35f37c5abf1-f6/s1280x1920/c86995ddee2840dabfff99995367a58ed1382687.gif" alt="Banner" />
        </a>

        <div class="typing-wrap">
          <span class="typing-text">Hey, I'm Linus 👋</span>
        </div>

        <p align="center">
          FullStack developer from Sweden — I like building things that actually work.
        </p>

        <hr />

        <div class="skills-section">
          <h3>🧠 What I'm good at</h3>
          <div class="skill-row">
            <span class="skill-icon">⚛️</span>
            <span class="skill-area">Frontend</span>
            <span class="skill-techs">React, HTML/CSS, JavaScript</span>
          </div>
          <div class="skill-row">
            <span class="skill-icon">🐍</span>
            <span class="skill-area">Backend</span>
            <span class="skill-techs">Python, Node.js</span>
          </div>
          <div class="skill-row">
            <span class="skill-icon">📱</span>
            <span class="skill-area">Mobile</span>
            <span class="skill-techs">Flutter, Android</span>
          </div>
          <div class="skill-row">
            <span class="skill-icon">🛠️</span>
            <span class="skill-area">Other</span>
            <span class="skill-techs">Git, Linux, C#, Unity</span>
          </div>
        </div>

        <hr />

        <h3>🔨 What I'm working on</h3>
        <p><span class="flutter-tag">Flutter app</span></p>

        <hr />

        <h3>📬 Reach me</h3>
        <a class="email-link" href="mailto:linus.arneng@scalebit.com">
          <img src="https://img.shields.io/badge/Email-linus.arneng%40scalebit.com-blue?style=for-the-badge&logo=gmail" alt="Email" />
        </a>

      </article>
    </div>
  </div>
</body>
</html>
